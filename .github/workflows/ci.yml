name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "hardening/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint (entire repository)
        run: bunx eslint .
      - name: Production build
        run: bun run build
