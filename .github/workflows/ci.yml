name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "hardening/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format repository
        run: bunx prettier --write .
      - name: Commit formatting on first-party PR branches
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply Prettier formatting"
            git push origin "HEAD:${GH_HEAD_REF}"
            curl --fail-with-body -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GH_REPOSITORY}/actions/workflows/ci.yml/dispatches" -d "{\"ref\":\"${GH_HEAD_REF}\"}"
          fi
      - name: Production build (regenerates TanStack route tree)
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint (entire repository)
        run: bunx eslint .
      - name: Server-function auth coverage
        run: bun run check:server-auth
