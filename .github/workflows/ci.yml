name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed application modules
        run: >-
          bunx eslint
          src/components/PasswordGate.tsx
          src/lib/app-config.functions.ts
          src/lib/mahavtaar.functions.ts
          src/lib/mahavtaar.server.ts
          src/routes/__root.tsx
          src/routes/_authenticated/admin-loan-audit.tsx
          --rule 'prettier/prettier: off'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
